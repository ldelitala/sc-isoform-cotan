# analysis/config/ding_cortex_2.gene.yaml
#
# GSE132044 — mouse cortex, "Cortex2 10x-Chromium-v2" cells, GENE level.
# Values transcribed from
# work/ding_cortex_2/analysis/Rscripts/gene/{01_init,02_calc,03_plot_gdi,04_cluster}.R
#
# This run exists for one reason: its `local_gene_cluster` labels are transferred
# onto the transcript object (step 06 of the transcript config) so that
# gene-level and transcript-level DTU candidates can be compared. It has no DTU
# step of its own.

root: /data/lorenzo_delitala
dataset: ding_cortex_2
level: gene

meta:
  geo_id: GSE132044
  seq_method: 10XV2
  condition: Ding_Cortex2_Gene

logging_level: 3

run: ["02", "03", "04", "05"]

paths:
  workdir: work/ding_cortex_2/analysis
  logs: work/ding_cortex_2/analysis/logs
  objects: work/ding_cortex_2/analysis/objects
  plots: work/ding_cortex_2/analysis/plots

  # this run starts from the GEO count matrix, not from a Seurat object
  input_matrix: inputs/geo_metadata/ding_cortex_2/GSE132044_cortex_mm10_count_matrix.mtx.gz
  input_matrix_genes: inputs/geo_metadata/ding_cortex_2/GSE132044_cortex_mm10_gene.tsv.gz
  input_matrix_cells: inputs/geo_metadata/ding_cortex_2/GSE132044_cortex_mm10_cell.tsv.gz.1

# File names inside paths.objects. `initialized` is the cleaned COTAN object the
# gene-level driver called cleaned.gene.cotan.rds.
objects:
  initialized: cleaned.gene.cotan.rds
  calculated: calculated.gene.cotan.rds
  clustered: clustered.gene.rds

steps:
  init_cotan:
    # step 02 builds the COTAN object directly from the count matrix
    matrix:
      barcode_pattern: "Cortex2\\.10x-Chromium-v2\\."
      gene_name_pattern: "^.*_"
    drop_fully_expressed: true

  calc:
    cores: 40
    chunk_size: 512
    gdi_chunk_size: 512

  gdi:
    condition: Cortex2_genes
    # the released gene script passed no GDIThreshold (CO TAN default 1.0)
    threshold: null
    file_name: GDI_genes_plot_markers.png
    markers:
      NPGs: [Nes, Vim, Sox2, Sox1, Notch1, Hes1, Hes5, Pax6]
      PNGs: [Map2, Tubb3, Neurod1, Nefm, Nefl, Dcx, Tbr1]
      HK: [Calm1, Cox6b1, Ppia, Rpl18, Cox7c, Erh, H3f3a, Taf1, Taf2,
           Gapdh, Actb, Golph3, Zfr, Sub1, Tars, Amacr]

  clustering:
    cl_name: local_gene_cluster
    initial_clusters: null
    cores: 40
