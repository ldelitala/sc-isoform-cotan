name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lintr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install lintr
        run: |
          Rscript -e '
            repos <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org")
            install.packages("lintr", repos = repos)
          '
      - name: Lint
        run: |
          Rscript -e '
            dirs <- c("cotanisoform", "analysis")
            dirs <- dirs[dir.exists(dirs)]
            lints <- unlist(lapply(dirs, lintr::lint_dir), recursive = FALSE)
            print(lints)
            if (length(lints) > 0L) quit(status = 1L)
          '
